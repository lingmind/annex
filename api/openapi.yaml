      properties:
        generatedAt:
          type: string
          format: date-time
        range:
          type: object
          required: [type, start, end, bucket, tzOffsetMinutes]
          properties:
            type:
              type: string
              enum: [day, week, month, year]
            start:
              type: string
              format: date-time
              description: 统计窗口起点，包含该时刻。
            end:
              type: string
              format: date-time
              description: 统计窗口终点，不包含该时刻。
            bucket:
              type: string
              enum: [hour, day, month]
            tzOffsetMinutes:
              type: integer
              minimum: -840
              maximum: 840
        totals:
          type: object
          required: [total, categories]
          properties:
            total:
              type: integer
              minimum: 0
