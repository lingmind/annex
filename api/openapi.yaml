        total:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        claimed:
          type: integer
          minimum: 0
        true_positive:
          type: integer
          minimum: 0
        false_positive:
          type: integer
          minimum: 0
        uncertain:
          type: integer
          minimum: 0
        duplicate:
          type: integer
          minimum: 0
