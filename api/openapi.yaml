              type: string
            taskType:
              type: string
              enum: [immediate, timed, conditional]
            state:
              type: string
              enum: [sent, in_progress, paused, ok, failed, cancelled, timeout]
            progress:
              type: object
              additionalProperties: true
            executeTime:
              type: [string, 'null']
              format: date-time
            rthAltitude:
              type: [integer, 'null']
            mediaCount:
              type: integer
            flightTimeSeconds:
              type: [integer, 'null']
            totalDistanceMeters:
              type: [integer, 'null']
            result:
              type: object
              additionalProperties: true
            flightStats:
              type: object
              additionalProperties: true
            device:
              $ref: '#/components/schemas/RelationRecord'
            wayline:
              $ref: '#/components/schemas/RelationRecord'
            project:
              $ref: '#/components/schemas/RelationRecord'
          additionalProperties: true
    RawDataRecord:
      allOf:
        - $ref: '#/components/schemas/RadixRecord'
        - type: object
          required: [code, assetKind, format, captureTime, fileUrl, fileSize, state]
          properties:
            code:
              type: string
            name:
              type: [string, 'null']
            assetKind:
              type: string
              enum: [image, video, thermal, sensor, audio, point_cloud, document, other]
            format:
              type: string
            captureTime:
              type: string
              format: date-time
            fileUrl:
              type: string
              description: 资源地址；调用方不应假定其为永久公开 URL。
            fileSize:
              type: string
              pattern: '^\d+$'
              description: 文件字节数。Radix bigint 以十进制字符串传输。
            checksum:
              type: [string, 'null']
            state:
              type: string
              enum: [uploading, available, processing, archived, error]
            media:
              type: object
              additionalProperties: true
            rawLocation:
              type: object
              additionalProperties: true
            targetLocation:
              type: object
              additionalProperties: true
            metadata:
              type: object
              additionalProperties: true
            quality:
              type: object
              additionalProperties: true
            tags:
              type: object
              additionalProperties: true
            device:
              $ref: '#/components/schemas/RelationRecord'
            mission:
              $ref: '#/components/schemas/RelationRecord'
            wayline:
              $ref: '#/components/schemas/RelationRecord'
            trajectory:
              $ref: '#/components/schemas/RelationRecord'
            viewpoint:
              $ref: '#/components/schemas/RelationRecord'
            project:
              $ref: '#/components/schemas/RelationRecord'
          additionalProperties: true
    RuleHitRecord:
      allOf:
        - $ref: '#/components/schemas/RadixRecord'
        - type: object
          required: [ruleId, reviewState, severity, occurredAt]
          properties:
            code:
              type: [string, 'null']
            ruleId:
              type: string
              description: 规则业务 ID；不是 rule 关系的 documentId。
            ruleCode:
              type: [string, 'null']
            ruleName:
              type: [string, 'null']
            riskType:
              type: [string, 'null']
            category:
              type: [string, 'null']
              enum: [work_violation, facility_hazard, environment_risk, other, null]
            reviewState:
              type: string
              enum: [pending, claimed, reviewed]
            reviewDecision:
              type: [string, 'null']
              enum: [true_positive, false_positive, uncertain, duplicate, null]
            reviewReasonCode:
              type: [string, 'null']
            reviewReasonDetail:
              type: [string, 'null']
            reviewedAt:
              type: [string, 'null']
              format: date-time
            severity:
              type: string
              enum: [info, warning, major, critical]
            score:
              type: [number, 'null']
            traceId:
              type: [string, 'null']
            occurredAt:
              type: string
              format: date-time
            evidences:
              type: array
              items:
                $ref: '#/components/schemas/RuleHitEvidenceRecord'
            rule:
              $ref: '#/components/schemas/RelationRecord'
            rawDatum:
              type: array
              items:
                $ref: '#/components/schemas/RelationRecord'
            project:
              $ref: '#/components/schemas/RelationRecord'
            tags:
              type: object
              additionalProperties: true
          additionalProperties: true
    RuleHitEvidenceRecord:
      type: object
      required: [code, emissionKey, sourceKind, targetRefs, decisionTrace, trackerContext, selectedFacts, ruleSnapshot]
      properties:
        id:
          type: integer
        code:
          type: string
        emissionKey:
          type: string
        sourceKind:
          type: string
          enum: [uav_realtime, uav_offline, fixed_camera]
        targetRefs:
          type: object
          additionalProperties: true
        decisionTrace:
          type: object
          additionalProperties: true
        trackerContext:
          type: object
          additionalProperties: true
        selectedFacts:
          type: object
          additionalProperties: true
        ruleSnapshot:
          type: object
          additionalProperties: true
        observation:
          $ref: '#/components/schemas/ObservationRecord'
        rule:
          $ref: '#/components/schemas/RelationRecord'
      additionalProperties: true
    ObservationRecord:
      allOf:
        - $ref: '#/components/schemas/RadixRecord'
        - type: object
          required: [sceneType, occurredAt]
          properties:
            observationKey:
              type: [string, 'null']
              description: Canonical 观测幂等键。
            sceneType:
              type: string
              enum: [image, video_frame, video_clip]
            occurredAt:
              type: string
              format: date-time
            sourceUrl:
              type: [string, 'null']
            confidence:
              type: [number, 'null']
              minimum: 0
              maximum: 1
            frameTimeMs:
              type: [string, 'null']
              description: 视频帧相对时间，毫秒；Radix biginteger 字段。
            mediaTimeMs:
              type: [number, string, 'null']
              description: 统一视频时间轴，毫秒；Radix decimal 字段。
            frameUtcAt:
              type: [string, 'null']
              format: date-time
            payloadIndex:
              type: [string, 'null']
            cameraType:
              type: [string, 'null']
            traceId:
              type: [string, 'null']
            selectionRank:
              type: [object, array, 'null']
              description: Canonical 最优证据选择序位；JSON 值由生产者定义。
            bestSnapshotRank:
              type: [object, array, 'null']
              description: 真实媒体快照选择序位；JSON 值由生产者定义。
            primaryFrameAnchor:
              type: [object, array, 'null']
              description: 主判定槽位的来源帧锚点。
            observationFrameAnchor:
              type: [object, array, 'null']
              description: 当前观测投影的来源帧锚点。
            observationFactIds:
              description: 观测帧投影中的依赖闭合事实 ID；JSON 结构由生产者定义。
            primaryPayloadDigest:
              type: [string, 'null']
            mediaPayloadDigest:
              type: [string, 'null']
            mediaRef:
              description: 观测媒体引用；JSON 结构由生产者定义。
            viewpointMatch:
              description: 观测视点匹配结果；JSON 结构由生产者定义。
            detections:
              type: array
              description: 显式 populate detections 后返回的模型原始检测结果。
              items:
                $ref: '#/components/schemas/DetectionRecord'
            classifications:
              type: array
              items:
                $ref: '#/components/schemas/ClassificationRecord'
            insights:
              type: array
              items:
                $ref: '#/components/schemas/InsightRecord'
            imageSize:
              $ref: '#/components/schemas/ImageSizeRecord'
            inferenceMeta:
              $ref: '#/components/schemas/InferenceMetaRecord'
            stream:
              $ref: '#/components/schemas/RelationRecord'
            rawDatum:
              $ref: '#/components/schemas/RelationRecord'
            device:
              $ref: '#/components/schemas/RelationRecord'
            mission:
              $ref: '#/components/schemas/RelationRecord'
            wayline:
              $ref: '#/components/schemas/RelationRecord'
            trajectory:
              $ref: '#/components/schemas/RelationRecord'
            viewpoint:
              $ref: '#/components/schemas/RelationRecord'
            project:
              $ref: '#/components/schemas/RelationRecord'
            landmark:
              $ref: '#/components/schemas/RelationRecord'
            aiModel:
              $ref: '#/components/schemas/RelationRecord'
            aiModelVersion:
              $ref: '#/components/schemas/RelationRecord'
            dataProcess:
              $ref: '#/components/schemas/RelationRecord'
            detectionProfile:
              $ref: '#/components/schemas/RelationRecord'
            spatialZone:
              $ref: '#/components/schemas/RelationRecord'
          additionalProperties: true
          description: >
            RuleHit Evidence 关联的 Radix Observation。关系及组件仅在各级显式 populate 时返回；
            其他观测标量字段和空间组件可能随记录一同返回。
    DetectionRecord:
      type: object
      required: [class, bboxX, bboxY, bboxW, bboxH]
      properties:
        id:
          type: integer
          description: Radix 组件内部 ID。
        class:
          type: string
        label:
          type: [string, 'null']
        confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        bboxX:
          type: number
        bboxY:
          type: number
        bboxW:
          type: number
        bboxH:
          type: number
        bboxNormX:
          type: [number, 'null']
        bboxNormY:
          type: [number, 'null']
        bboxNormW:
          type: [number, 'null']
        bboxNormH:
          type: [number, 'null']
        outputType:
          type: [string, 'null']
          description: 检测几何类型，如 bbox、obb 或 segmentation。
        geometrySource:
          type: [string, 'null']
        obb:
          description: 模型原始旋转框 JSON。
        obbPoints:
          description: 原图像素坐标系下的旋转框角点 JSON。
        obbPointsNorm:
          description: 归一化旋转框角点 JSON。
        maskPolygons:
          description: 原图像素坐标系下的分割多边形 JSON。
        maskPolygonsNorm:
          description: 归一化分割多边形 JSON。
        frameTimeMs:
          type: [integer, 'null']
        trackId:
          type: [string, 'null']
        riskLevel:
          type: [string, 'null']
          enum: [low, medium, high, critical, null]
      additionalProperties: true
    ClassificationRecord:
      type: object
      required: [class]
      properties:
        id:
          type: integer
        class:
          type: string
        label:
          type: [string, 'null']
        confidence:
          type: [number, 'null']
        rank:
          type: [integer, 'null']
        classId:
          type: [integer, 'null']
      additionalProperties: true
    InsightRecord:
      type: object
      required: [message]
      properties:
        id:
          type: integer
        type:
          type: [string, 'null']
        message:
          type: string
        score:
          type: [number, 'null']
      additionalProperties: true
    ImageSizeRecord:
      type: object
      required: [width, height]
      properties:
        id:
          type: integer
        width:
          type: integer
        height:
          type: integer
      additionalProperties: true
    InferenceMetaRecord:
      type: object
      required: [modelId]
      properties:
        id:
          type: integer
        modelId:
          type: string
        modelVersion:
          type: [string, 'null']
        aiModel:
          description: 推理时模型身份快照；JSON 结构由生产者定义。
        modelVersionRef:
          description: 推理时模型版本引用；JSON 结构由生产者定义。
        inferenceConfig:
          description: 推理配置快照；JSON 结构由生产者定义。
        detectionProfile:
          description: 检测配置快照；JSON 结构由生产者定义。
        inferenceTimeMs:
          type: [integer, 'null']
        confidenceAvg:
          type: [number, 'null']
      additionalProperties: true
    RadixMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/RadixPagination'
      additionalProperties: true
    RadixPagination:
      type: object
      required: [page, pageSize, pageCount, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        pageCount:
          type: integer
        total:
          type: integer
      additionalProperties: true
    Device:
      type: object
      required: [id, name, type, state, projectCode]
      properties:
        id:
          type: string
        name:
          type: string
        sn:
          type: [string, 'null']
        type:
          type: string
          enum: [drone, drone-dock, camera, detector, led-controller, network-device, nvr, robot]
        vendor:
          type: [string, 'null']
        model:
          type: [string, 'null']
        projectCode:
          type: string
        edgeId:
          type: [string, 'null']
        state:
          type: string
          enum: [online, offline, error, maintenance, active]
        online:
          type: boolean
        lastSeenAt:
          type: [string, 'null']
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    Mission:
      type: object
      required: [id, name, type, state, projectCode]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [immediate, timed, conditional]
        state:
          type: string
          enum: [sent, in_progress, paused, ok, failed, cancelled, timeout]
        projectCode:
          type: string
        deviceIds:
          type: array
          items:
            type: string
        startedAt:
          type: [string, 'null']
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    RawData:
      type: object
      required: [id, type, projectCode, createdAt]
      properties:
        id:
          type: string
        projectCode:
          type: string
        missionId:
          type: [string, 'null']
        deviceId:
          type: [string, 'null']
        type:
          type: string
          enum: [image, video, thermal, sensor, audio, point_cloud, document, other]
        mimeType:
          type: [string, 'null']
        sizeBytes:
          type: [integer, 'null']
          format: int64
        downloadUrl:
          type: [string, 'null']
          format: uri
          description: Phoenix 签发的短期 URL，不应暴露对象存储内部地址。
        capturedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    RuleHit:
      type: object
      required: [id, ruleId, ruleName, severity, state, projectCode, hitAt]
      properties:
        id:
          type: string
        projectCode:
          type: string
        ruleId:
          type: string
        ruleName:
          type: string
        severity:
          type: string
          enum: [info, warning, major, critical]
        state:
          type: string
          enum: [pending, claimed, reviewed]
        deviceId:
          type: [string, 'null']
        missionId:
          type: [string, 'null']
        rawDataId:
          type: [string, 'null']
        hitAt:
          type: string
          format: date-time
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        metadata:
          type: object
          additionalProperties: true
    Evidence:
      type: object
      required: [type]
      properties:
        type:
          type: string
        url:
          type: [string, 'null']
          format: uri
        thumbnailUrl:
          type: [string, 'null']
          format: uri
        rawDataId:
          type: [string, 'null']
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
        metadata:
          type: object
          additionalProperties: true
    EventEnvelope:
      type: object
      required: [id, type, occurredAt, projectCode, data]
      properties:
        id:
          type: string
        type:
          type: string
          examples:
            - device.updated
            - mission.updated
            - raw-data.ready
            - rule-hit.created
        occurredAt:
          type: string
          format: date-time
        projectCode:
          type: string
        data:
          type: object
          additionalProperties: true
          description: 事件类型对应的 JSON 对象载荷。
    ErrorResponse:
      oneOf:
        - $ref: '#/components/schemas/PhoenixErrorResponse'
        - $ref: '#/components/schemas/RadixErrorResponse'
        - $ref: '#/components/schemas/AnnexErrorResponse'
        - $ref: '#/components/schemas/CruxErrorResponse'
        - $ref: '#/components/schemas/CruxValidationErrorResponse'
      description: >
        Phoenix 自身错误通常使用字符串 error；上游资源错误保留结构化错误对象；
        Annex 适配层可使用带 code 和 requestId 的结构化错误；Crux 工作流错误使用 statusCode、message 和 error。
    CruxErrorResponse:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string
      description: Crux 工作流的 NestJS 错误响应。
    CruxValidationErrorResponse:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          enum: [400]
        message:
          type: array
          items:
            type: string
        error:
          type: string
      description: Crux DTO 校验错误响应，message 包含各字段的校验错误。
    PhoenixErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    RadixErrorResponse:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: 上游资源错误响应中固定为 null。
        error:
          type: object
          required: [status, name, message]
          properties:
            status:
              type: integer
            name:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    AnnexErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: [string, 'null']
