openapi: 3.1.0
info:
  title: LingMind Annex 开放集成 API
  version: 0.1.0
  summary: 面向 LingMind 外部集成的稳定 API。
  license:
    name: MIT
    identifier: MIT
  description: >
    LingMind Annex SDK/CLI 通过 Phoenix 网关调用 LingMind 能力。当前 HTTP 传输层使用
    Phoenix 已存在的认证接口和 Radix 代理接口；客户端库负责把 Radix 原始响应映射为 Annex 标准对象。
servers:
  - url: https://{host}
    variables:
      host:
        default: phoenix.example.com
security:
  - BearerAuth: []
  - ApiKeyAuth: []
tags:
  - name: Auth
    description: Phoenix 用户登录、刷新和退出。
  - name: Devices
    description: 设备清单和在线状态。
  - name: Missions
    description: 任务元数据和生命周期状态。
  - name: RawData
    description: 采集媒体和数据元信息。
  - name: RuleHits
    description: AI 和规则检测结果。
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 使用 LingMind 用户名密码登录 Phoenix。
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
      responses:
        '200':
          description: 访问令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAuthToken
      summary: 使用 refresh token 刷新访问令牌。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: 新的访问令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 退出当前 Phoenix access token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRevokeRequest'
      responses:
        '200':
          description: 已退出。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /proxy/radix/api/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: 查询当前集成可见的设备列表。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: filters[state][$eq]
          in: query
          schema:
            type: string
        - name: filters[deviceType][$eq]
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/UpdatedAfter'
        - $ref: '#/components/parameters/UpdatedBefore'
      responses:
        '200':
          description: 设备列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: device:read
  /proxy/radix/api/devices/{deviceId}:
    get:
      tags: [Devices]
      operationId: getDevice
      summary: 查询单个设备。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 设备。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadixItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: device:read
  /proxy/radix/api/missions:
    get:
      tags: [Missions]
      operationId: listMissions
      summary: 查询当前集成可见的任务列表。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: filters[state][$eq]
          in: query
          schema:
            type: string
        - name: filters[taskType][$eq]
          in: query
          schema:
            type: string
        - name: filters[device][documentId][$eq]
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/UpdatedAfter'
        - $ref: '#/components/parameters/UpdatedBefore'
      responses:
        '200':
          description: 任务列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: mission:read
  /proxy/radix/api/missions/{missionId}:
    get:
      tags: [Missions]
      operationId: getMission
      summary: 查询单个任务。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: missionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 任务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadixItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: mission:read
  /proxy/radix/api/raw-data:
    get:
      tags: [RawData]
      operationId: listRawData
      summary: 查询当前集成可见的原始数据列表。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: filters[type][$eq]
          in: query
          schema:
            type: string
        - name: filters[mission][documentId][$eq]
          in: query
          schema:
            type: string
        - name: filters[device][documentId][$eq]
          in: query
          schema:
            type: string
        - name: filters[captureTime][$gte]
          in: query
          schema:
            type: string
            format: date-time
        - name: filters[captureTime][$lte]
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 原始数据列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawDataListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: raw-data:read
  /proxy/radix/api/raw-data/{rawDataId}:
    get:
      tags: [RawData]
      operationId: getRawData
      summary: 查询单条原始数据记录。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: rawDataId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 原始数据。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadixItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: raw-data:read
  /proxy/radix/api/rule-hits:
    get:
      tags: [RuleHits]
      operationId: listRuleHits
      summary: 查询当前集成可见的规则命中列表。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: filters[reviewState][$eq]
          in: query
          schema:
            type: string
        - name: filters[severity][$eq]
          in: query
          schema:
            type: string
            enum: [info, low, medium, high, critical]
        - name: filters[ruleId][$eq]
          in: query
          schema:
            type: string
        - name: filters[mission][documentId][$eq]
          in: query
          schema:
            type: string
        - name: filters[device][documentId][$eq]
          in: query
          schema:
            type: string
        - name: filters[occurredAt][$gte]
          in: query
          schema:
            type: string
            format: date-time
        - name: filters[occurredAt][$lte]
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 规则命中列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleHitListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: rule-hit:read
  /proxy/radix/api/rule-hits/{ruleHitId}:
    get:
      tags: [RuleHits]
      operationId: getRuleHit
      summary: 查询单条规则命中。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: ruleHitId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 规则命中。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadixItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: rule-hit:read
webhooks:
  annexEvent:
    post:
      operationId: receiveAnnexEvent
      summary: 接收 LingMind Annex Webhook 事件。
      parameters:
        - name: X-LM-Event
          in: header
          required: true
          schema:
            type: string
        - name: X-LM-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-LM-Timestamp
          in: header
          required: true
          schema:
            type: string
        - name: X-LM-Signature
          in: header
          required: true
          schema:
            type: string
            example: sha256=6a6f...
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '204':
          description: 事件已接收。
        '400':
          description: 请求无效。
        '401':
          description: 签名校验失败。
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-LM-API-Key
  parameters:
    ProjectID:
      name: X-Requested-Project
      in: header
      required: false
      description: Radix project documentId selected for this request.
      schema:
        type: string
    Page:
      name: pagination[page]
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pagination[pageSize]
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    UpdatedAfter:
      name: filters[updatedAt][$gte]
      in: query
      schema:
        type: string
        format: date-time
    UpdatedBefore:
      name: filters[updatedAt][$lte]
      in: query
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: 请求参数无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 缺少凭证或凭证无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 凭证有效，但缺少所需 Annex scope 或对象权限。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在，或不在调用方权限边界内。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error:
      description: 错误响应。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AuthTokenRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: LingMind 用户名。
        password:
          type: string
          format: password
          description: LingMind 密码。
    AuthRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    AuthRevokeRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
          description: 待退出的 access token。也可以通过 Authorization Bearer 传入。
    AuthTokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          examples: [Bearer]
        expires_in:
          type: integer
          description: access token 有效秒数。
        refresh_token:
          type: string
        issued_at:
          type: string
          format: date-time
        user:
          type: object
          additionalProperties: true
          description: Phoenix 返回的用户上下文。Annex SDK 会从中提取常用身份信息。
    DeviceListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RadixRecord'
        meta:
          $ref: '#/components/schemas/RadixMeta'
    MissionListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RadixRecord'
        meta:
          $ref: '#/components/schemas/RadixMeta'
    RawDataListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RadixRecord'
        meta:
          $ref: '#/components/schemas/RadixMeta'
    RuleHitListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RadixRecord'
        meta:
          $ref: '#/components/schemas/RadixMeta'
    RadixItemResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RadixRecord'
    RadixRecord:
      type: object
      additionalProperties: true
      description: Radix 原始记录。Annex SDK 会映射为 Device、Mission、RawData 或 RuleHit 标准对象。
    RadixMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/RadixPagination'
      additionalProperties: true
    RadixPagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
      additionalProperties: true
    Device:
      type: object
      required: [id, name, type, state, projectCode]
      properties:
        id:
          type: string
        name:
          type: string
        sn:
          type: [string, 'null']
        type:
          type: string
        vendor:
          type: [string, 'null']
        model:
          type: [string, 'null']
        projectCode:
          type: string
        edgeId:
          type: [string, 'null']
        state:
          type: string
        online:
          type: boolean
        lastSeenAt:
          type: [string, 'null']
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    Mission:
      type: object
      required: [id, name, type, state, projectCode]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        state:
          type: string
        projectCode:
          type: string
        deviceIds:
          type: array
          items:
            type: string
        startedAt:
          type: [string, 'null']
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    RawData:
      type: object
      required: [id, type, projectCode, createdAt]
      properties:
        id:
          type: string
        projectCode:
          type: string
        missionId:
          type: [string, 'null']
        deviceId:
          type: [string, 'null']
        type:
          type: string
        mimeType:
          type: [string, 'null']
        sizeBytes:
          type: [integer, 'null']
          format: int64
        downloadUrl:
          type: [string, 'null']
          format: uri
          description: Phoenix 签发的短期 URL，不应暴露对象存储内部地址。
        capturedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    RuleHit:
      type: object
      required: [id, ruleId, ruleName, severity, state, projectCode, hitAt]
      properties:
        id:
          type: string
        projectCode:
          type: string
        ruleId:
          type: string
        ruleName:
          type: string
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        state:
          type: string
        deviceId:
          type: [string, 'null']
        missionId:
          type: [string, 'null']
        rawDataId:
          type: [string, 'null']
        hitAt:
          type: string
          format: date-time
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        metadata:
          type: object
          additionalProperties: true
    Evidence:
      type: object
      required: [type]
      properties:
        type:
          type: string
        url:
          type: [string, 'null']
          format: uri
        thumbnailUrl:
          type: [string, 'null']
          format: uri
        rawDataId:
          type: [string, 'null']
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
        metadata:
          type: object
          additionalProperties: true
    EventEnvelope:
      type: object
      required: [id, type, occurredAt, projectCode, data]
      properties:
        id:
          type: string
        type:
          type: string
          examples:
            - device.updated
            - mission.updated
            - raw-data.ready
            - rule-hit.created
        occurredAt:
          type: string
          format: date-time
        projectCode:
          type: string
        data:
          oneOf:
            - $ref: '#/components/schemas/Device'
            - $ref: '#/components/schemas/Mission'
            - $ref: '#/components/schemas/RawData'
            - $ref: '#/components/schemas/RuleHit'
            - type: object
              additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: [string, 'null']
