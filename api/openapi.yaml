        - name: rule
          in: query
          description: 规则 code 或名称，多个值以逗号分隔。
          schema:
            type: string
        - name: severity
          in: query
          description: 严重级别，多个值以逗号分隔。
          schema:
            type: string
        - name: state
          in: query
          description: 事件状态，多个值以逗号分隔。
          schema:
            type: string
      responses:
        '200':
