  /proxy/radix/api/incidents/stats:
    get:
      tags:
        - Incidents
      operationId: getIncidentStats
      summary: 查询事件闭环统计。
      description: 按发生时间统计事件，resolved 和 ignored 均计入已闭环。响应直接返回报告对象，不含 data/meta 包装；趋势包括严重级别、类型、项目、区域和规则。当前最多扫描
        5000 条，limit 控制各分组和最近事件条数。
      parameters:
