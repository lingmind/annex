openapi: 3.1.0
info:
  title: LingMind Annex 开放集成 API
  version: 0.2.0
  summary: 面向 LingMind 外部集成的稳定 API。
  license:
    name: MIT
    identifier: MIT
  description: >
    LingMind Annex SDK/CLI 通过 Phoenix 网关调用 LingMind 能力。认证接口返回访问令牌和
    当前用户上下文；资源接口使用 documentId 作为稳定的外部对象标识。Go SDK 会进一步把
    原始记录映射为 Annex 标准对象。
servers:
  - url: https://{host}
    variables:
      host:
        default: phoenix.example.com
security:
  - BearerAuth: []
tags:
  - name: Auth
    description: Phoenix 用户名密码登录、短信登录、令牌刷新和退出。
  - name: Devices
    description: 设备清单和在线状态。
  - name: Missions
    description: 任务元数据和生命周期状态。
  - name: RawData
    description: 采集媒体和数据元信息。
  - name: RuleHits
    description: AI 和规则检测结果。
  - name: Webhooks
    description: Annex 向外部系统投递的签名事件。
  - name: Incidents
    description: 事件查询、统计与闭环处置。
  - name: ClosedLoopActions
    description: 事件闭环策略执行和处理记录。
  - name: Messages
    description: 当前登录用户的个人消息和已读操作。
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 使用 LingMind 用户名密码登录 Phoenix。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
      responses:
        '200':
          description: 访问令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/auth/sms/code:
    post:
      tags: [Auth]
      operationId: requestSmsCode
      summary: 请求网页端短信登录验证码。
      description: 仅在目标环境启用短信认证时可用；重发频率由服务端限制。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsCodeRequest'
      responses:
        '200':
          description: 验证码挑战已创建并发送。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /api/auth/sms/login:
    post:
      tags: [Auth]
      operationId: loginWithSms
      summary: 使用短信验证码登录 Phoenix。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsLoginRequest'
      responses:
        '200':
          description: 访问令牌和当前用户上下文。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAuthToken
      summary: 使用 refresh token 刷新访问令牌。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: 新的访问令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 退出当前 Phoenix access token。
      description: >
        优先从 Authorization Bearer 读取 access token；未传该 Header 时可在请求体中传入
        access_token。无论上游令牌撤销是否返回错误，Phoenix 都会清理当前登录流程并返回成功消息。
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRevokeRequest'
      responses:
        '200':
          description: 已退出。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /proxy/radix/api/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: 查询当前集成可见的设备列表。
      description: >
        默认只返回设备标量字段。可通过 populate 展开 project、edge、landmark、streams、groups、
        alerts、missions、viewpoints、mqttBroker 以及设备属性组件。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/Populate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: filters[state][$eq]
          in: query
          schema:
            type: string
            enum: [online, offline, error, maintenance, active]
        - name: filters[deviceType][$eq]
          in: query
          description: 按设备类型精确筛选；设备类型可由平台能力扩展。
          schema:
            type: string
        - $ref: '#/components/parameters/UpdatedAfter'
        - $ref: '#/components/parameters/UpdatedBefore'
      responses:
        '200':
          description: 设备列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: device:view
  /proxy/radix/api/devices/{deviceId}:
    get:
      tags: [Devices]
      operationId: getDevice
      summary: 查询单个设备。
      description: >
        默认只返回设备标量字段。可通过 populate 展开 project、edge、landmark、streams、groups、
        alerts、missions、viewpoints、mqttBroker 以及设备属性组件。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/Populate'
        - name: deviceId
          in: path
          required: true
          description: 设备 documentId。
          schema:
            type: string
      responses:
        '200':
          description: 设备。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: device:view
  /proxy/radix/api/missions:
    get:
      tags: [Missions]
      operationId: listMissions
      summary: 查询当前集成可见的任务列表。
      description: >
        默认只返回任务标量字段。可通过 populate 展开 wayline、device、rawData、trajectories、
        viewpoints、project 和 sharedProjects。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/Populate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: filters[state][$eq]
          in: query
          schema:
            type: string
            enum: [sent, in_progress, paused, ok, failed, cancelled, timeout]
        - name: filters[taskType][$eq]
          in: query
          schema:
            type: string
            enum: [immediate, timed, conditional]
        - name: filters[device][documentId][$eq]
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/UpdatedAfter'
        - $ref: '#/components/parameters/UpdatedBefore'
      responses:
        '200':
          description: 任务列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: task:view
  /proxy/radix/api/missions/{missionId}:
    get:
      tags: [Missions]
      operationId: getMission
      summary: 查询单个任务。
      description: >
        默认只返回任务标量字段。可通过 populate 展开 wayline、device、rawData、trajectories、
        viewpoints、project 和 sharedProjects。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/Populate'
        - name: missionId
          in: path
          required: true
          description: 任务 documentId。
          schema:
            type: string
      responses:
        '200':
          description: 任务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: task:view
  /proxy/radix/api/raw-data:
    get:
      tags: [RawData]
      operationId: listRawData
      summary: 查询当前集成可见的原始数据列表。
      description: >
        默认只返回原始数据标量字段。可通过 populate 展开 device、mission、wayline、trajectory、
        viewpoint、landmark、spatialZone、storageConfig、project、sharedProjects、dataProcesses、
        rawNotes、aerialVideos 以及媒体和时空组件。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/Populate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: filters[assetKind][$eq]
          in: query
          schema:
            type: string
            enum: [image, video, thermal, sensor, audio, point_cloud, document, other]
        - name: filters[mission][documentId][$eq]
          in: query
          schema:
            type: string
        - name: filters[device][documentId][$eq]
          in: query
          schema:
            type: string
        - name: filters[captureTime][$gte]
          in: query
          schema:
            type: string
            format: date-time
        - name: filters[captureTime][$lte]
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 原始数据列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawDataListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: data:view
  /proxy/radix/api/raw-data/{rawDataId}:
    get:
      tags: [RawData]
      operationId: getRawData
      summary: 查询单条原始数据记录。
      description: >
        默认只返回原始数据标量字段。可通过 populate 展开 device、mission、wayline、trajectory、
        viewpoint、landmark、spatialZone、storageConfig、project、sharedProjects、dataProcesses、
        rawNotes、aerialVideos 以及媒体和时空组件。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/Populate'
        - name: rawDataId
          in: path
          required: true
          description: 原始数据 documentId。
          schema:
            type: string
      responses:
        '200':
          description: 原始数据。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawDataItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: data:view
  /proxy/radix/api/rule-hits:
    get:
      tags: [RuleHits]
      operationId: listRuleHits
      summary: 查询当前集成可见的规则命中列表。
      description: |
        默认只返回规则命中标量字段。可通过 populate 展开 rule、evidences、rawDatum、
        primaryIncident、relatedIncidents、reviewedBy、assignedReviewer 和 project；evidences 内部的
        observation、rule 等关系需要使用深层 populate。查询证据关联观测的检测结果：
        `populate[evidences][populate][observation][populate][0]=detections`。
        该路径依次展开 evidences 组件、observation 关系和 detections 组件；响应中的
        `data[].evidences[].observation.detections[]` 结构见 ObservationRecord 和 DetectionRecord。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/Populate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: filters[reviewState][$eq]
          in: query
          schema:
            type: string
            enum: [pending, claimed, reviewed]
        - name: filters[severity][$eq]
          in: query
          schema:
            type: string
            enum: [info, warning, major, critical]
        - name: filters[ruleId][$eq]
          in: query
          schema:
            type: string
        - name: filters[rawDatum][documentId][$eq]
          in: query
          description: 按关联原始数据的 documentId 过滤。
          schema:
            type: string
        - name: filters[occurredAt][$gte]
          in: query
          schema:
            type: string
            format: date-time
        - name: filters[occurredAt][$lte]
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 规则命中列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleHitListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: ai-event:view
  /proxy/radix/api/rule-hits/facets:
    get:
      tags: [RuleHits]
      operationId: getRuleHitFacets
      summary: 按指定维度查询规则命中分组及审核计数。
      description: |
        用于规则命中目录和筛选导航，基于 filters 匹配的全部记录分组，不受分页限制，
        dimension 必填，每次选择一个维度。
        rule 使用命中关联的规则；spatialZone、viewpoint、aiModel 使用首条证据关联观测的关系。
        occurredAt 按指定时区的自然日分组，并返回 UTC 起止时间（含起点、不含终点）。
        其他维度的 value 为关联对象 documentId；缺失关联或时间时 value 为 null。
        日期分组倒序，其他分组按名称排序，缺失值分组排在最后；无记录的分组不返回。
        stats 和 totals 包含待审核、已领取以及已审核的各类结论计数。
        响应直接返回分组对象，不包含 data/meta 包装。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: dimension
          in: query
          required: true
          description: 分组维度：区域、发生日期、规则、机位或模型。
          schema:
            type: string
            enum: [spatialZone, occurredAt, rule, viewpoint, aiModel]
        - name: tzOffsetMinutes
          in: query
          description: 相对 UTC 的时区偏移分钟数；北京时间为 480，用于 occurredAt 分组。
          schema:
            type: integer
            minimum: -840
            maximum: 840
            default: 0
        - name: filters[reviewState][$eq]
          in: query
          schema:
            type: string
            enum: [pending, claimed, reviewed]
        - name: filters[severity][$eq]
          in: query
          schema:
            type: string
            enum: [info, warning, major, critical]
        - name: filters[ruleId][$eq]
          in: query
          schema:
            type: string
        - name: filters[rawDatum][documentId][$eq]
          in: query
          schema:
            type: string
        - name: filters[occurredAt][$gte]
          in: query
          schema:
            type: string
            format: date-time
        - name: filters[occurredAt][$lte]
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 分组及审核计数。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleHitFacetsResponse'
        '400':
          description: 分组维度或时区参数无效。
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: ai-event:view
  /proxy/radix/api/rule-hits/stats:
    get:
      tags: [RuleHits]
      operationId: getRuleHitStats
      summary: 查询当前集成可见的规则命中统计。
      description: |
        按 occurredAt 统计截至当前时刻的滚动时间窗口，返回分类汇总、时间序列和最近命中。
        day 按小时分桶，week 和 month 按天分桶，year 按月分桶；空时间桶补零。
        tzOffsetMinutes 用于时间桶边界和标签，窗口起止时间仍返回 UTC 时间。
        category 和 categories 的值合并去重；未分类命中使用 uncategorized。
        响应直接返回统计对象，不包含 data/meta 包装。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: range
          in: query
          description: 滚动时间范围：最近一天、七天、一个月或一年。
          schema:
            type: string
            enum: [day, week, month, year]
            default: day
        - name: tzOffsetMinutes
          in: query
          description: 相对 UTC 的时区偏移分钟数；北京时间为 480。
          schema:
            type: integer
            minimum: -840
            maximum: 840
            default: 0
        - name: category
          in: query
          description: 分类筛选，多个分类以逗号分隔。
          schema:
            type: string
        - name: categories
          in: query
          description: 分类筛选数组，也支持在每个值中使用逗号分隔。
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: recentLimit
          in: query
          description: 最近命中数量；服务端向下取整并限制在 1 到 100 之间。
          schema:
            type: number
            default: 10
      responses:
        '200':
          description: 规则命中统计。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleHitStatsResponse'
        '400':
          description: 统计参数无效。
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: ai-event:view
  /proxy/radix/api/rule-hits/{ruleHitId}:
    get:
      tags: [RuleHits]
      operationId: getRuleHit
      summary: 查询单条规则命中。
      description: |
        默认只返回规则命中标量字段。可通过 populate 展开 rule、evidences、rawDatum、
        primaryIncident、relatedIncidents、reviewedBy、assignedReviewer 和 project；evidences 内部的
        observation、rule 等关系需要使用深层 populate。查询证据关联观测的检测结果：
        `populate[evidences][populate][observation][populate][0]=detections`。
        该路径依次展开 evidences 组件、observation 关系和 detections 组件；响应中的
        `data.evidences[].observation.detections[]` 结构见 ObservationRecord 和 DetectionRecord。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/Populate'
        - name: ruleHitId
          in: path
          required: true
          description: 规则命中 documentId。
          schema:
            type: string
      responses:
        '200':
          description: 规则命中。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleHitItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      x-annex-scope: ai-event:view
  /proxy/radix/api/incidents:
    get:
      tags:
        - Incidents
      operationId: listIncidents
      summary: 查询事件列表。
      description: 默认只返回标量字段；关系需显式 populate，查询受当前用户的项目和数据权限约束。 可展开 project、primaryRuleHit、relatedRuleHits、responsibleUsers、alerts、closedLoopActions、acknowledgedBy、resolvedBy、displacement、responsibilityZone、dispositionEvidence。区域负责人可处置，其他获授权用户可查看事件和处理记录；处置必须调用
        Crux resolve/ignore 操作。
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/Populate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: filters[state][$eq]
          in: query
          schema:
            type: string
            enum:
              - open
              - acknowledged
              - resolved
              - ignored
            description: 事件状态
        - name: filters[severity][$eq]
