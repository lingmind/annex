name: OpenAPI contract
on:
  pull_request:
    paths:
      - api/openapi.yaml
      - .github/workflows/openapi.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install openapi-spec-validator==0.7.2
      - run: openapi-spec-validator api/openapi.yaml
