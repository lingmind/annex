name: Agent release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up validation
        run: |
          python3 -m venv .codex-venv
          .codex-venv/bin/pip install PyYAML
      - name: Validate and package the exact tag
        run: |
          set -eu
          version="$(.codex-venv/bin/python -c 'import json; print(json.load(open("plugins/release.json"))["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          make validate-plugins PYTHON="$PWD/.codex-venv/bin/python"
          .codex-venv/bin/python scripts/release-agent-plugins.py --source-commit "$GITHUB_SHA" --published-at "$(date -u +%s)"
      - name: Upload release assets as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes
          find dist/agents -type f -exec gh release upload "$GITHUB_REF_NAME" '{}' +
